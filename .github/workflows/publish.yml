name: Publish to PyPI

on:
  push:
    tags:
      - "v*"          # triggers on v0.2.0, v0.3.0, etc.

jobs:
  build-and-publish:
    runs-on: ubuntu-latest
    environment: pypi          # must match the environment set on PyPI (optional but recommended)
    permissions:
      contents: read
      id-token: write          # REQUIRED for Trusted Publishing + provenance attestations

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install build tools
        run: pip install build

      - name: Build sdist and wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        # No password: Trusted Publishing uses the OIDC token from `id-token: write`.
        # `attestations` defaults to true, which restores provenance for this release.

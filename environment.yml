# Conda environment for scPyviewer.
#   conda env create -f environment.yml
#   conda activate scPyviewer
#   pip install -e .            # installs the `scpyviewer` + `scpyviewer-prepare` commands
name: scPyviewer
channels:
  - conda-forge
dependencies:
  - python=3.11
  - scanpy>=1.10
  - anndata>=0.10
  - numpy>=1.24
  - pandas>=2.0
  - scipy>=1.10
  - scikit-learn>=1.3
  - matplotlib>=3.7
  - plotly>=5.20
  - streamlit>=1.30
  - leidenalg>=0.10
  - python-igraph>=0.11
  - openpyxl>=3.1
  - pytest>=7.0
  - pytest-cov>=4.0
  - pip
  - pip:
      - -e .

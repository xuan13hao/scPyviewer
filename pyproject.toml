[build-system]
requires = ["setuptools>=64", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "scPyviewer"
version = "0.2.0"
description = "Python-native interactive viewer and programmatic API for single-cell AnnData (.h5ad) objects"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "scPyviewer authors", email = "xuanhao@iu.edu" }]
keywords = ["single-cell", "scRNA-seq", "AnnData", "scanpy", "visualization", "streamlit"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering :: Bio-Informatics",
    "License :: OSI Approved :: MIT License",
]
dependencies = [
    "scanpy>=1.10",
    "anndata>=0.10",
    "numpy>=1.24",
    "pandas>=2.0",
    "scipy>=1.10",
    "scikit-learn>=1.3",
    "matplotlib>=3.7",
    "plotly>=5.20",
]

[project.optional-dependencies]
# Interactive Streamlit app (the `scpyviewer` launcher needs this).
app = ["streamlit>=1.30"]
# prepare.py clustering extras.
prepare = ["leidenalg>=0.10", "igraph>=0.11"]
# Table export to .xlsx.
excel = ["openpyxl>=3.1"]
# Testing.
dev = ["pytest>=7.0", "pytest-cov>=4.0"]
all = ["streamlit>=1.30", "leidenalg>=0.10", "igraph>=0.11", "openpyxl>=3.1"]

[project.scripts]
scpyviewer = "scPyviewer._launch:main"
scpyviewer-prepare = "scPyviewer.prepare:main"

[project.urls]
Homepage = "https://github.com/xuan13hao/scPyviewer"

[tool.setuptools]
# pure-python package plus the app script that Streamlit runs by path
packages = ["scPyviewer"]

[tool.setuptools.package-data]
scPyviewer = ["*.py"]
